name: AEP API Regression

on:

  workflow_dispatch:
    inputs:
      environment:
        description: Test Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat
          - prod

  push:
    branches:
      - main
      - Updates

  pull_request:
    branches:
      - main
      - Updates


jobs:

  test:

    name: Run AEP API Regression

    runs-on: ubuntu-latest

    # Use the selected GitHub environment.
    # For push/PR, default to dev.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    timeout-minutes: 30


    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Install Postman CLI
      # ----------------------------------------

      - name: Install Postman CLI
        shell: bash
        run: |
          curl -o- https://dl-cli.pstmn.io/install/linux64.sh | sh
          echo "$HOME/.postman/bin" >> "$GITHUB_PATH"


      # ----------------------------------------
      # 3. Verify Postman CLI
      # ----------------------------------------

      - name: Verify Postman CLI
        run: |
          postman --version
          postman collection run --help


      # ----------------------------------------
      # 4. Authenticate Postman CLI
      # ----------------------------------------

      - name: Authenticate Postman CLI
        shell: bash
        env:
         POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |

         if [ -z "$POSTMAN_API_KEY" ]; then
           echo "ERROR: POSTMAN_API_KEY GitHub secret is not configured"
           exit 1
         fi

         postman login --with-api-key "$POSTMAN_API_KEY"

         echo "Postman CLI authentication successful"

      
      # ----------------------------------------
      # 5. Mask sensitive values
      # ----------------------------------------
    
      - name: Mask sensitive values
        shell: bash
        env:
          AEP_CLIENT_ID: ${{ secrets.AEP_CLIENT_ID }}
          AEP_CLIENT_SECRET: ${{ secrets.AEP_CLIENT_SECRET }}
          AEP_IMS_ORG: ${{ secrets.AEP_IMS_ORG }}
        run: |
          echo "::add-mask::$AEP_CLIENT_ID"
          echo "::add-mask::$AEP_CLIENT_SECRET"
          echo "::add-mask::$AEP_IMS_ORG"
      
      
      
      # ----------------------------------------
      # 6. Inspect Postman files
      # ----------------------------------------

      - name: Inspect Postman files
        run: |
          echo "=== Postman files ==="
          find postman -maxdepth 6 -type f | sort

          echo ""
          echo "=== Collection directory ==="
          ls -la postman/collections/aep-regression


      # ----------------------------------------
      # 7. Prepare Postman Environment
      # ----------------------------------------

      - name: Prepare Postman Environment
        id: environment
        shell: bash
        env:
          AEP_CLIENT_ID: ${{ secrets.AEP_CLIENT_ID }}
          AEP_CLIENT_SECRET: ${{ secrets.AEP_CLIENT_SECRET }}
          AEP_SCOPE: ${{ secrets.AEP_SCOPE }}
          AEP_IMS_ORG: ${{ secrets.AEP_IMS_ORG }}
          AEP_SANDBOX_NAME: ${{ vars.AEP_SANDBOX_NAME }}
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"

          echo "Running AEP API Regression against: $ENVIRONMENT"

          ENV_FILE="postman/environments/${ENVIRONMENT}.json"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Environment template not found: $ENV_FILE"
            exit 1
          fi

          echo "Using environment template: $ENV_FILE"

          cat > postman/environments/ci-environment.json <<EOF
          {
            "id": "aep-ci-environment",
            "name": "AEP CI Environment",
            "values": [
              {
                "key": "IMS",
                "value": "ims-na1.adobelogin.com",
                "type": "default",
                "enabled": true
              },
              {
                "key": "AEP_CLIENT_ID",
                "value": "$AEP_CLIENT_ID",
                "type": "default",
                "enabled": true
              },
              {
                "key": "AEP_CLIENT_SECRET",
                "value": "$AEP_CLIENT_SECRET",
                "type": "secret",
                "enabled": true
              },
              {
                "key": "AEP_SCOPE",
                "value": "$AEP_SCOPE",
                "type": "default",
                "enabled": true
              },
              {
                "key": "AEP_IMS_ORG",
                "value": "$AEP_IMS_ORG",
                "type": "secret",
                "enabled": true
              },
              {
                "key": "AEP_SANDBOX_NAME",
                "value": "$AEP_SANDBOX_NAME",
                "type": "default",
                "enabled": true
              },
              {
                "key": "CONTAINER_ID",
                "value": "tenant",
                "type": "default",
                "enabled": true
              },
              {
                "key": "ACCESS_TOKEN",
                "value": "",
                "type": "secret",
                "enabled": true
              }
            ]
          }
          EOF
          
          echo "AEP_CLIENT_ID configured: $([ -n "$AEP_CLIENT_ID" ] && echo yes || echo no)"
          echo "AEP_CLIENT_SECRET configured: $([ -n "$AEP_CLIENT_SECRET" ] && echo yes || echo no)"
          echo "AEP_SCOPE configured: $([ -n "$AEP_SCOPE" ] && echo yes || echo no)"
          echo "AEP_IMS_ORG configured: $([ -n "$AEP_IMS_ORG" ] && echo yes || echo no)"
          echo "AEP_SANDBOX_NAME configured: $([ -n "$AEP_SANDBOX_NAME" ] && echo yes || echo no)"


          echo "ENV_FILE=postman/environments/ci-environment.json" >> "$GITHUB_OUTPUT"



      # ----------------------------------------
      # 8. Validate Postman collection
      # ----------------------------------------

      - name: Validate Postman Collection
        run: |
          postman collection lint \
            "postman/collections/aep-regression"


      
      # ----------------------------------------
      # 9. Run Postman collection
      # ----------------------------------------

      - name: Run AEP API Regression
        id: postman
        if: always()
        shell: bash
        env:
          AEP_CLIENT_ID: ${{ secrets.AEP_CLIENT_ID }}
          AEP_CLIENT_SECRET: ${{ secrets.AEP_CLIENT_SECRET }}
          AEP_SCOPE: ${{ secrets.AEP_SCOPE }}
          AEP_IMS_ORG: ${{ secrets.AEP_IMS_ORG }}
          AEP_SANDBOX_NAME: ${{ vars.AEP_SANDBOX_NAME }}

        run: |
          set -o pipefail

          echo "=== Running Postman collection ==="

          set +e

          postman collection run \
            "postman/collections/aep-regression" \
            --environment "postman/environments/ci-environment.json" \
            --reporters cli \
            2>&1 | tee postman-results-raw.txt

          POSTMAN_EXIT_CODE=${PIPESTATUS[0]}

          set -e

          echo "=== Postman exit code: $POSTMAN_EXIT_CODE ==="

          echo "=== Creating sanitised Postman report ==="

          cp postman-results-raw.txt postman-results.txt

          if [ -n "$AEP_CLIENT_SECRET" ]; then
            sed -i "s|${AEP_CLIENT_SECRET}|***REDACTED***|g" postman-results.txt
          fi

          if [ -n "$AEP_CLIENT_ID" ]; then
            sed -i "s|${AEP_CLIENT_ID}|***REDACTED***|g" postman-results.txt
          fi

          if [ -n "$AEP_SCOPE" ]; then
            sed -i "s|${AEP_SCOPE}|***REDACTED***|g" postman-results.txt
          fi

          if [ -n "$AEP_IMS_ORG" ]; then
            sed -i "s|${AEP_IMS_ORG}|***REDACTED***|g" postman-results.txt
          fi

          echo "=== Sanitised report created ==="
          ls -lh postman-results-raw.txt
          ls -lh postman-results.txt

          echo "=== Jira test keys after sanitisation ==="
          grep -E '^Root ' postman-results.txt || true

          echo "=== Postman results available for downstream steps ==="

          # Do NOT exit 1 here.
          # We want JUnit/Xray/reporting to run even when Postman tests fail.
          echo "POSTMAN_EXIT_CODE=$POSTMAN_EXIT_CODE" >> "$GITHUB_OUTPUT"
  



      # ----------------------------------------
      # 10. Generate JUnit XML for Xray
      # ----------------------------------------

      - name: Generate JUnit XML for Xray
        if: always()
        shell: bash
        run: |
          echo "=== Generating JUnit XML ==="

          if [ ! -f "postman-results.txt" ]; then
            echo "ERROR: postman-results.txt does not exist"
            echo "=== Current directory ==="
            pwd
            echo "=== Files ==="
            ls -la
            exit 1
          fi

          echo "=== Postman results found ==="
          ls -lh postman-results.txt

          node scripts/postman-to-junit.js

          if [ ! -f "test-results.xml" ]; then
            echo "ERROR: test-results.xml was not created"
            exit 1
          fi

          echo "=== JUnit XML successfully created ==="
          cat test-results.xml


      
      
      # ----------------------------------------
      # 11. Authenticate with Xray Cloud
      # ----------------------------------------
      
      - name: Authenticate with Xray Cloud
        if: always()
        id: xray-auth
        shell: bash
        run: |
          TOKEN=$(curl -s \
            -H "Content-Type: application/json" \
            -X POST \
            https://xray.cloud.getxray.app/api/v2/authenticate \
            -d '{
              "client_id":"${{ secrets.XRAY_CLIENT_ID }}",
              "client_secret":"${{ secrets.XRAY_CLIENT_SECRET }}"
            }')

          TOKEN=$(echo "$TOKEN" | tr -d '"')

          echo "XRAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "Authentication successful"
      
      
      # ----------------------------------------
      # 12. Check Xray JUnit file
      # ----------------------------------------    
      
      - name: Check Xray JUnit file
        if: always()
        shell: bash
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Files ==="
          ls -la

          echo "=== JUnit file ==="
          if [ -f "test-results.xml" ]; then
            echo "test-results.xml exists"
            ls -lh test-results.xml
            echo "=== Contents ==="
            cat test-results.xml
          else
            echo "ERROR: test-results.xml does not exist"
            exit 1
          fi

      
      
      # ----------------------------------------
      # 13. Publish the Results to Xray
      # ----------------------------------------

      - name: Publish Results to Xray
        id: xray-publish
        if: always()
        shell: bash
        run: |

         echo "=== Xray JUnit file check ==="
         pwd
         ls -lh test-results.xml

         RESPONSE=$(curl -s \
           --fail-with-body \
           -H "Authorization: Bearer $XRAY_TOKEN" \
           -H "Content-Type: text/xml" \
           --data-binary "@$(pwd)/test-results.xml" \
           "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${{ secrets.XRAY_PROJECT_KEY }}"
          )

          echo "===== XRAY RESPONSE ====="
          echo "$RESPONSE"

          XRAY_EXECUTION_KEY=$(echo "$RESPONSE" | node -e "
          let data='';
          process.stdin.on('data', chunk => data += chunk);
          process.stdin.on('end', () => {
            try {
              const json = JSON.parse(data);
              console.log(json.key || '');
            } catch {
              console.log('');
            }
          });
          ")

          echo "=== Xray Test Execution ==="
          echo "Key: $XRAY_EXECUTION_KEY"

          echo "XRAY_EXECUTION_KEY=$XRAY_EXECUTION_KEY" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 14. Diagnose Xray Test Runs
      # ----------------------------------------
      
      - name: Diagnose Xray Test Runs
        if: always()
        env:
          XRAY_TOKEN: ${{ env.XRAY_TOKEN }}
          XRAY_EXECUTION_KEY: ${{ secrets.XRAY_PROJECT_KEY }}
        shell: bash
        
        run: |
            set +e

            echo "=== Xray Test Run Diagnostic ==="
            echo "Execution key: $XRAY_EXECUTION_KEY"

            if [ -z "$XRAY_TOKEN" ]; then
              echo "ERROR: XRAY_TOKEN is empty"
              exit 1
            fi

            if [ -z "$XRAY_EXECUTION_KEY" ]; then
              echo "ERROR: XRAY_EXECUTION_KEY is empty"
              exit 1
            fi

            echo "XRAY_TOKEN is present"
            echo ""

            # --------------------------------------------------
            # Get Test Runs for this Test Execution
            # --------------------------------------------------

            echo "=== Querying Xray Test Runs ==="

            RUN_QUERY='
            {
              getTestRuns(
                testExecIssueKeys: ["'"$XRAY_EXECUTION_KEY"'"]
                limit: 100
                start: 0
              ) {
                total
                limit
                start

                results {
                  id

                  status {
                    name
                    description
                  }

                  test {
                    issueId
                  }

                  testExecution {
                    issueId
                  }

                  steps {
                    id
                    action
                    data
                    result
                    actualResult
                    comment

                    status {
                      name
                    }
                   }
                  }
                 }
                }'

                echo "=== GraphQL Query ==="
                echo "$RUN_QUERY"
                echo ""

                HTTP_CODE=$(curl -s \
                  -o xray-test-runs.json \
                  -w "%{http_code}" \
                  -X POST \
                  -H "Authorization: Bearer $XRAY_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data "$(jq -n --arg query "$RUN_QUERY" '{query: $query}')" \
                  "https://xray.cloud.getxray.app/api/v2/graphql")

                echo "HTTP status: $HTTP_CODE"
                echo ""

                echo "=== Raw Xray Response ==="
                cat xray-test-runs.json
                echo ""

                echo "=== Parsed Response ==="
                jq . xray-test-runs.json 2>/dev/null || true
                echo ""

                echo "=== Test Run Summary ==="

                jq -r '
                  .data.getTestRuns.results[]? |
                  "Test Run ID: \(.id) | Test issue ID: \(.test.issueId) | Status: \(status.name)"
                ' xray-test-runs.json 2>/dev/null || true

                echo ""

                echo "=== Test Run Details ==="

                jq -r '
                  .data.getTestRuns.results[]? |

                  "========================================",
                  "Test Run ID: \(.id)",
                  "Test issue ID: \(.test.issueId)",
                  "Status: \(status.name)",
                  "----------------------------------------",

                  (.steps[]? |
                    "Step ID: \(.id)",
                    "Status: \(status.name)",
                    "Action: \(.action // "(none)")",
                    "Data: \(.data // "(none)")",
                    "Result: \(.result // "(none)")",
                    "Actual Result: \(.actualResult // "(none)")",
                    "Comment: \(.comment // "(none)")",
                    ""
                  )
                ' xray-test-runs.json 2>/dev/null || true

                echo ""
                echo "=== Diagnostic complete ==="

  

      
      # ----------------------------------------
      # 14. Generate Postman Test Summary
      # ----------------------------------------
          
      - name: Generate Postman Test Summary
        if: always()
        shell: bash
        run: |

          echo "## 🧪 AEP API Test Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------:|" >> "$GITHUB_STEP_SUMMARY"

          # Extract the Postman summary rows.
          REQUEST_LINE=$(grep -E '^\|[[:space:]]+requests[[:space:]]+\|' postman-results.txt || true)
          ASSERTION_LINE=$(grep -E '^\|[[:space:]]+assertions[[:space:]]+\|' postman-results.txt || true)

          # Extract executed and failed values.
          REQUESTS=$(echo "$REQUEST_LINE" |
            sed -E 's/.*\|[[:space:]]*([0-9]+)[[:space:]]*\|[[:space:]]*([0-9]+)[[:space:]]*\|.*/\1/' || true)

          FAILED_REQUESTS=$(echo "$REQUEST_LINE" |
            sed -E 's/.*\|[[:space:]]*([0-9]+)[[:space:]]*\|[[:space:]]*([0-9]+)[[:space:]]*\|.*/\2/' || true)

          ASSERTIONS=$(echo "$ASSERTION_LINE" |
            sed -E 's/.*\|[[:space:]]*([0-9]+)[[:space:]]*\|[[:space:]]*([0-9]+)[[:space:]]*\|.*/\1/' || true)

          FAILED_ASSERTIONS=$(echo "$ASSERTION_LINE" |
            sed -E 's/.*\|[[:space:]]*([0-9]+)[[:space:]]*\|[[:space:]]*([0-9]+)[[:space:]]*\|.*/\2/' || true)

          # Fallback values.
          [ -z "$REQUESTS" ] && REQUESTS="N/A"
          [ -z "$FAILED_REQUESTS" ] && FAILED_REQUESTS="N/A"
          [ -z "$ASSERTIONS" ] && ASSERTIONS="N/A"
          [ -z "$FAILED_ASSERTIONS" ] && FAILED_ASSERTIONS="N/A"

          echo "| 📋 Requests | $REQUESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ❌ Failed Requests | $FAILED_REQUESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔎 Assertions | $ASSERTIONS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ❌ Failed Assertions | $FAILED_ASSERTIONS |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 🌐 Execution Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ github.event.inputs.environment || 'dev' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Collection | aep-regression |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Framework | Postman CLI |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | GitHub-hosted Ubuntu |" >> "$GITHUB_STEP_SUMMARY"


      
      # ----------------------------------------
      # 15. Upload Postman results
      # ----------------------------------------

      - name: Upload Postman Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: postman-results
         path: postman-results.txt
         retention-days: 10

    


      # ----------------------------------------
      # 16. Check test result
      # ----------------------------------------

      - name: Check Test Result
        if: always()
        shell: bash
        run: |
          POSTMAN_EXIT_CODE="${{ steps.postman.outputs.POSTMAN_EXIT_CODE }}"

          echo "Postman exit code: $POSTMAN_EXIT_CODE"

          if [ "$POSTMAN_EXIT_CODE" != "0" ]; then
            echo "AEP API Regression failed"
            exit 1
          fi

          echo "AEP API Regression passed"


