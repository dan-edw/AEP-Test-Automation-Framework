name: AEP API Regression

on:

  workflow_dispatch:
    inputs:
      environment:
        description: Test Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat
          - prod

  push:
    branches:
      - main
      - Updates

  pull_request:
    branches:
      - main
      - Updates


jobs:

  test:

    name: Run AEP API Regression

    runs-on: ubuntu-latest

    # Use the selected GitHub environment.
    # For push/PR, default to dev.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    timeout-minutes: 30


    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Install Postman CLI
      # ----------------------------------------

      - name: Install Postman CLI
        shell: bash
        run: |
          curl -o- https://dl-cli.pstmn.io/install/linux64.sh | sh
          echo "$HOME/.postman/bin" >> "$GITHUB_PATH"


      # ----------------------------------------
      # 3. Verify Postman CLI
      # ----------------------------------------

      - name: Verify Postman CLI
        run: |
          postman --version
          postman collection run --help


      # ----------------------------------------
      # 4. Authenticate Postman CLI
      # ----------------------------------------

      - name: Authenticate Postman CLI
        shell: bash
        env:
         POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |

         if [ -z "$POSTMAN_API_KEY" ]; then
           echo "ERROR: POSTMAN_API_KEY GitHub secret is not configured"
           exit 1
         fi

         postman login --with-api-key "$POSTMAN_API_KEY"

         echo "Postman CLI authentication successful"

      
      # ----------------------------------------
      # 5. Mask sensitive values
      # ----------------------------------------
    
      - name: Mask sensitive values
        shell: bash
        env:
          AEP_CLIENT_ID: ${{ secrets.AEP_CLIENT_ID }}
          AEP_CLIENT_SECRET: ${{ secrets.AEP_CLIENT_SECRET }}
          AEP_IMS_ORG: ${{ secrets.AEP_IMS_ORG }}
        run: |
          echo "::add-mask::$AEP_CLIENT_ID"
          echo "::add-mask::$AEP_CLIENT_SECRET"
          echo "::add-mask::$AEP_IMS_ORG"
      
      
      
      # ----------------------------------------
      # 6. Inspect Postman files
      # ----------------------------------------

      - name: Inspect Postman files
        run: |
          echo "=== Postman files ==="
          find postman -maxdepth 6 -type f | sort

          echo ""
          echo "=== Collection directory ==="
          ls -la postman/collections/aep-regression


      # ----------------------------------------
      # 7. Prepare Postman Environment
      # ----------------------------------------

      - name: Prepare Postman Environment
        id: environment
        shell: bash
        env:
          AEP_CLIENT_ID: ${{ secrets.AEP_CLIENT_ID }}
          AEP_CLIENT_SECRET: ${{ secrets.AEP_CLIENT_SECRET }}
          AEP_SCOPE: ${{ secrets.AEP_SCOPE }}
          AEP_IMS_ORG: ${{ secrets.AEP_IMS_ORG }}
          AEP_SANDBOX_NAME: ${{ vars.AEP_SANDBOX_NAME }}
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"

          echo "Running AEP API Regression against: $ENVIRONMENT"

          ENV_FILE="postman/environments/${ENVIRONMENT}.json"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Environment template not found: $ENV_FILE"
            exit 1
          fi

          echo "Using environment template: $ENV_FILE"

          cat > postman/environments/ci-environment.json <<EOF
          {
            "id": "aep-ci-environment",
            "name": "AEP CI Environment",
            "values": [
              {
                "key": "IMS",
                "value": "ims-na1.adobelogin.com",
                "type": "default",
                "enabled": true
              },
              {
                "key": "AEP_CLIENT_ID",
                "value": "$AEP_CLIENT_ID",
                "type": "default",
                "enabled": true
              },
              {
                "key": "AEP_CLIENT_SECRET",
                "value": "$AEP_CLIENT_SECRET",
                "type": "secret",
                "enabled": true
              },
              {
                "key": "AEP_SCOPE",
                "value": "$AEP_SCOPE",
                "type": "default",
                "enabled": true
              },
              {
                "key": "AEP_IMS_ORG",
                "value": "$AEP_IMS_ORG",
                "type": "secret",
                "enabled": true
              },
              {
                "key": "AEP_SANDBOX_NAME",
                "value": "$AEP_SANDBOX_NAME",
                "type": "default",
                "enabled": true
              },
              {
                "key": "CONTAINER_ID",
                "value": "tenant",
                "type": "default",
                "enabled": true
              },
              {
                "key": "ACCESS_TOKEN",
                "value": "",
                "type": "secret",
                "enabled": true
              }
            ]
          }
          EOF
          
          echo "AEP_CLIENT_ID configured: $([ -n "$AEP_CLIENT_ID" ] && echo yes || echo no)"
          echo "AEP_CLIENT_SECRET configured: $([ -n "$AEP_CLIENT_SECRET" ] && echo yes || echo no)"
          echo "AEP_SCOPE configured: $([ -n "$AEP_SCOPE" ] && echo yes || echo no)"
          echo "AEP_IMS_ORG configured: $([ -n "$AEP_IMS_ORG" ] && echo yes || echo no)"
          echo "AEP_SANDBOX_NAME configured: $([ -n "$AEP_SANDBOX_NAME" ] && echo yes || echo no)"


          echo "ENV_FILE=postman/environments/ci-environment.json" >> "$GITHUB_OUTPUT"



      # ----------------------------------------
      # 8. Validate Postman collection
      # ----------------------------------------

      - name: Validate Postman Collection
        run: |
          postman collection lint \
            "postman/collections/aep-regression"


      
      # ----------------------------------------
      # 9. Run Postman collection
      # ----------------------------------------

      - name: Run AEP API Regression
        id: postman
        if: always()
        shell: bash
        env:
          AEP_CLIENT_ID: ${{ secrets.AEP_CLIENT_ID }}
          AEP_CLIENT_SECRET: ${{ secrets.AEP_CLIENT_SECRET }}
          AEP_SCOPE: ${{ secrets.AEP_SCOPE }}
          AEP_IMS_ORG: ${{ secrets.AEP_IMS_ORG }}
          AEP_SANDBOX_NAME: ${{ vars.AEP_SANDBOX_NAME }}

        run: |
          set -o pipefail

          echo "=== Running Postman collection ==="

          set +e

          postman collection run \
            "postman/collections/aep-regression" \
            --environment "postman/environments/ci-environment.json" \
            --reporters cli \
            2>&1 | tee postman-results-raw.txt

          POSTMAN_EXIT_CODE=${PIPESTATUS[0]}

          set -e

          echo "=== Postman exit code: $POSTMAN_EXIT_CODE ==="

          echo "=== Creating sanitised Postman report ==="

          cp postman-results-raw.txt postman-results.txt

          if [ -n "$AEP_CLIENT_SECRET" ]; then
            sed -i "s|${AEP_CLIENT_SECRET}|***REDACTED***|g" postman-results.txt
          fi

          if [ -n "$AEP_CLIENT_ID" ]; then
            sed -i "s|${AEP_CLIENT_ID}|***REDACTED***|g" postman-results.txt
          fi

          if [ -n "$AEP_SCOPE" ]; then
            sed -i "s|${AEP_SCOPE}|***REDACTED***|g" postman-results.txt
          fi

          if [ -n "$AEP_IMS_ORG" ]; then
            sed -i "s|${AEP_IMS_ORG}|***REDACTED***|g" postman-results.txt
          fi

          echo "=== Sanitised report created ==="
          ls -lh postman-results-raw.txt
          ls -lh postman-results.txt

          echo "=== Jira test keys after sanitisation ==="
          grep -E '^Root ' postman-results.txt || true

          echo "=== Postman results available for downstream steps ==="

          # Do NOT exit 1 here.
          # We want JUnit/Xray/reporting to run even when Postman tests fail.
          echo "POSTMAN_EXIT_CODE=$POSTMAN_EXIT_CODE" >> "$GITHUB_OUTPUT"
  



      # ----------------------------------------
      # 10. Generate JUnit XML for Xray
      # ----------------------------------------

      - name: Generate JUnit XML for Xray
        if: always()
        shell: bash
        run: |
          echo "=== Generating JUnit XML ==="

          if [ ! -f "postman-results.txt" ]; then
            echo "ERROR: postman-results.txt does not exist"
            echo "=== Current directory ==="
            pwd
            echo "=== Files ==="
            ls -la
            exit 1
          fi

          echo "=== Postman results found ==="
          ls -lh postman-results.txt

          node scripts/postman-to-junit.js

          if [ ! -f "test-results.xml" ]; then
            echo "ERROR: test-results.xml was not created"
            exit 1
          fi

          echo "=== JUnit XML successfully created ==="
          cat test-results.xml


      
      
      # ----------------------------------------
      # 11. Authenticate with Xray Cloud
      # ----------------------------------------
      
      - name: Authenticate with Xray Cloud
        if: always()
        id: xray-auth
        shell: bash
        run: |
          TOKEN=$(curl -s \
            -H "Content-Type: application/json" \
            -X POST \
            https://xray.cloud.getxray.app/api/v2/authenticate \
            -d '{
              "client_id":"${{ secrets.XRAY_CLIENT_ID }}",
              "client_secret":"${{ secrets.XRAY_CLIENT_SECRET }}"
            }')

          TOKEN=$(echo "$TOKEN" | tr -d '"')

          echo "XRAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "Authentication successful"
      
      
      # ----------------------------------------
      # 12. Check Xray JUnit file
      # ----------------------------------------    
      
      - name: Check Xray JUnit file
        if: always()
        shell: bash
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Files ==="
          ls -la

          echo "=== JUnit file ==="
          if [ -f "test-results.xml" ]; then
            echo "test-results.xml exists"
            ls -lh test-results.xml
            echo "=== Contents ==="
            cat test-results.xml
          else
            echo "ERROR: test-results.xml does not exist"
            exit 1
          fi

      
      
      # ----------------------------------------
      # 13. Publish the Results to Xray
      # ----------------------------------------

      - name: Publish Results to Xray
        id: xray
        if: always()
        shell: bash
        env:
          XRAY_TOKEN: ${{ env.XRAY_TOKEN }}
          XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}
        run: |
          set +e

          echo "=== Publishing JUnit Results to Xray ==="

          if [ -z "$XRAY_TOKEN" ]; then
            echo "ERROR: XRAY_TOKEN is empty"
            exit 1
          fi

          if [ -z "$XRAY_PROJECT_KEY" ]; then
            echo "ERROR: XRAY_PROJECT_KEY is empty"
            exit 1
          fi

          if [ ! -f "test-results.xml" ]; then
            echo "ERROR: test-results.xml does not exist"
            exit 1
          fi

          if [ ! -f "xray-test-results.json" ]; then
            echo "ERROR: xray-test-results.json does not exist"
            exit 1
          fi

          echo "XRAY_TOKEN is present"
          echo "XRAY_PROJECT_KEY is present"
          echo "Project: $XRAY_PROJECT_KEY"


          echo ""
          echo "=== JUnit file ==="
          ls -lh test-results.xml

          echo ""
          echo "=== Xray result file ==="
          ls -lh xray-test-results.json

          echo ""
          echo "=== Xray result data ==="
          cat xray-test-results.json

          # --------------------------------------------------
          # a. Import JUnit into Xray
          # --------------------------------------------------

          echo ""
          echo "=== Importing JUnit results into Xray ==="

          if [ -z "$XRAY_PROJECT_KEY" ]; then
            echo "ERROR: XRAY_PROJECT_KEY is empty"
            echo "Check that the GitHub secret exists and is mapped into the job environment."
            exit 1
          fi

          echo "Xray project key: $XRAY_PROJECT_KEY"
          echo "JUnit file: $(pwd)/test-results.xml"

          XRAY_IMPORT_URL="https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=$XRAY_PROJECT_KEY"

          echo "Import endpoint:"
          echo "$XRAY_IMPORT_URL"

          HTTP_CODE=$(curl -s \
            -o xray-import-response.json \
            -w "%{http_code}" \
            --fail-with-body \
            -H "Authorization: Bearer $XRAY_TOKEN" \
            -H "Content-Type: text/xml" \
            --data-binary "@$(pwd)/test-results.xml" \
            "$XRAY_IMPORT_URL")

          echo ""
          echo "HTTP status: $HTTP_CODE"

          echo ""
          echo "=== Xray Import Response ==="
          cat xray-import-response.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo ""
            echo "ERROR: Xray JUnit import failed"
            exit 1
          fi

          echo ""
          echo "SUCCESS: JUnit results imported into Xray"


          # --------------------------------------------------
          # b. Extract Test Execution key
          # --------------------------------------------------

          XRAY_EXECUTION_KEY=$(jq -r \
            '.key // empty' \
            xray-import-response.json)

          echo ""
          echo "=== Xray Test Execution ==="
          echo "Key: $XRAY_EXECUTION_KEY"

          if [ -z "$XRAY_EXECUTION_KEY" ]; then
            echo "ERROR: Xray execution key was not returned"
            exit 1
          fi

          echo "XRAY_EXECUTION_KEY=$XRAY_EXECUTION_KEY" >> "$GITHUB_ENV"

          # --------------------------------------------------
          # c. Find Xray Test Execution internal ID
          # --------------------------------------------------

          echo ""
          echo "=== Getting Xray Test Execution internal ID ==="

          EXEC_QUERY='{
            getTestExecutions(
              jql: "key = \"'"$XRAY_EXECUTION_KEY"'\""
              limit: 1
              start: 0
            ) {
              total
              results {
                issueId
              }
            }
          }'



            echo "=== Execution GraphQL Query ==="
            echo "$EXEC_QUERY"

            HTTP_CODE=$(curl -s \
              -o xray-execution.json \
              -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $XRAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n \
                --arg query "$EXEC_QUERY" \
                '{query: $query}')" \
              "https://xray.cloud.getxray.app/api/v2/graphql")

            echo "HTTP status: $HTTP_CODE"

            echo ""
            echo "=== Execution Response ==="
            cat xray-execution.json

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "ERROR: Could not query Xray Test Execution"
              exit 1
            fi

            XRAY_EXECUTION_ID=$(jq -r \
              '.data.getTestExecutions.results[0].issueId // empty' \
              xray-execution.json)

            echo ""
            echo "Xray execution internal ID: $XRAY_EXECUTION_ID"

            if [ -z "$XRAY_EXECUTION_ID" ]; then
              echo "ERROR: Xray execution internal ID was not found"
              exit 1
            fi

            echo "XRAY_EXECUTION_ID=$XRAY_EXECUTION_ID" >> "$GITHUB_ENV"

            # --------------------------------------------------
            # d. Get Test Runs belonging to this execution
            # --------------------------------------------------

            echo ""
            echo "=== Getting Xray Test Runs ==="

            RUN_QUERY='{
              getTestRuns(
                testExecIssueIds: ["'"$XRAY_EXECUTION_ID"'"]
                limit: 100
                start: 0
              ) {
                total
                results {
                  id
                  status {
                    name
                    description
                  }
                  test {
                    issueId
                    jira(fields: ["key", "summary"])
                  }
                  testExecution {
                    issueId
                  }
                }
              }
            }'

            echo "=== Test Run GraphQL Query ==="
            echo "$RUN_QUERY"

            HTTP_CODE=$(curl -s \
              -o xray-test-runs.json \
              -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $XRAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n \
                --arg query "$RUN_QUERY" \
                '{query: $query}')" \
              "https://xray.cloud.getxray.app/api/v2/graphql")

            echo "HTTP status: $HTTP_CODE"

            echo ""
            echo "=== Xray Test Runs ==="
            jq . xray-test-runs.json

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "ERROR: Could not retrieve Xray Test Runs"
              exit 1
            fi


            

            # --------------------------------------------------
            # e. Validate we received Test Runs
            # --------------------------------------------------

            TEST_RUN_COUNT=$(jq -r \
              'data.getTestRuns.total // 0' \
              xray-test-runs.json)

            echo ""
            echo "Xray Test Runs found: $TEST_RUN_COUNT"

            if [ "$TEST_RUN_COUNT" -eq 0 ]; then
              echo "ERROR: No Xray Test Runs were found"
              exit 1
            fi

            # --------------------------------------------------
            # f. Build Jira Test Key -> Xray Test Run ID mapping
            # --------------------------------------------------

            echo ""
            echo "=== Building Xray Test Run Mapping ==="

            declare -A XRAY_RUN_IDS

            while IFS='|' read -r TEST_KEY TEST_RUN_ID TEST_STATUS; do

            if [ -n "$TEST_KEY" ] && [ -n "$TEST_RUN_ID" ]; then
              XRAY_RUN_IDS["$TEST_KEY"]="$TEST_RUN_ID"

              echo "$TEST_KEY -> $TEST_RUN_ID [$TEST_STATUS]"
            fi

            done < <(
              jq -r '
                .data.getTestRuns.results[] |
                "\(.test.jira.key)|\(.id)|\(status.name)"
              ' xray-test-runs.json
            )

            # --------------------------------------------------
            # g. Update each individual Xray Test Run
            # --------------------------------------------------

            UPDATED_COUNT=0
            FAILED_UPDATE_COUNT=0

            echo ""
            echo "=== Updating Xray Test Run Comments ==="

            while IFS= read -r TEST_RESULT; do

              TEST_KEY=$(echo "$TEST_RESULT" | jq -r '.testKey')
              TEST_NAME=$(echo "$TEST_RESULT" | jq -r '.testName')
              TEST_STATUS=$(echo "$TEST_RESULT" | jq -r '.status')

              EXPECTED_STATUS=$(echo "$TEST_RESULT" | jq -r \
                '.expectedStatus // ""')

              ACTUAL_STATUS=$(echo "$TEST_RESULT" | jq -r \
                '.actualStatus // ""')

              ASSERTION=$(echo "$TEST_RESULT" | jq -r \
                '.assertion // ""')

              FAILURE_MESSAGE=$(echo "$TEST_RESULT" | jq -r \
                '.failureMessage // ""')

              METHOD=$(echo "$TEST_RESULT" | jq -r \
                '.method // ""')

              REQUEST_URL=$(echo "$TEST_RESULT" | jq -r \
                '.requestUrl // ""')

              TEST_RUN_ID="${XRAY_RUN_IDS[$TEST_KEY]}"

              echo ""
              echo "========================================"
              echo "Jira Test: $TEST_KEY"
              echo "Test Name: $TEST_NAME"
              echo "Status: $TEST_STATUS"
              echo "Xray Test Run: ${TEST_RUN_ID:-NOT FOUND}"
              echo "========================================"

              if [ -z "$TEST_RUN_ID" ]; then
                echo "ERROR: No Xray Test Run found for $TEST_KEY"
                FAILED_UPDATE_COUNT=$((FAILED_UPDATE_COUNT + 1))
                continue
              fi

              # ------------------------------------------------
              # h. Build human-readable Xray comment
              # ------------------------------------------------

              if [ "$TEST_STATUS" = "FAIL" ]; then

                COMMENT=$(cat <<EOF
              Jira Test: $TEST_KEY
              Xray Test Run: $TEST_RUN_ID

              Status:
              FAILED

              Actual Result:
              The Postman request failed an assertion.

              Request:
              $METHOD $REQUEST_URL

              Expected HTTP status:
              ${EXPECTED_STATUS:-N/A}

              Actual HTTP status:
              ${ACTUAL_STATUS:-N/A}

              Assertion:
              ${ASSERTION:-N/A}

              Failure Details:
              ${FAILURE_MESSAGE:-Postman test failed}
              EOF
              )

              elif [ "$TEST_STATUS" = "ERROR" ]; then

                COMMENT=$(cat <<EOF
              Jira Test: $TEST_KEY
              Xray Test Run: $TEST_RUN_ID

              Status:
              ERROR

              Actual Result:
              The Postman request could not be executed or no execution result was available.

              Request:
              $METHOD $REQUEST_URL

              Failure Details:
              ${FAILURE_MESSAGE:-No Postman execution result was available.}
              EOF
              )

              else

                COMMENT=$(cat <<EOF
              Jira Test: $TEST_KEY
              Xray Test Run: $TEST_RUN_ID

              Status:
              PASSED

              Actual Result:
              The Postman request completed successfully and all captured assertions passed.

              Request:
              $METHOD $REQUEST_URL

              Expected HTTP status:
              ${EXPECTED_STATUS:-N/A}

              Actual HTTP status:
              ${ACTUAL_STATUS:-N/A}

              Assertion Result:
              All captured assertions passed successfully.
              EOF
              )

              fi


              # ------------------------------------------------
              # i. Escape comment as GraphQL string
              # ------------------------------------------------

              COMMENT_JSON=$(printf '%s' "$COMMENT" | jq -Rs .)

              MUTATION=$(cat <<EOF
                mutation {
                  updateTestRunComment(
                    id: "$TEST_RUN_ID"
                    comment: $COMMENT_JSON
                  )
                }
                EOF
                )

                echo ""
                echo "=== Updating Xray Test Run $TEST_RUN_ID ==="

                echo "Mutation:"
                echo "$MUTATION"

                HTTP_CODE=$(curl -s \
                  -o xray-update-response.json \
                  -w "%{http_code}" \
                  -X POST \
                  -H "Authorization: Bearer $XRAY_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data "$(jq -n \
                  --arg query "$MUTATION" \
                  '{query: $query}')" \
                  "https://xray.cloud.getxray.app/api/v2/graphql")

                echo "HTTP status: $HTTP_CODE"

                echo ""
                echo "Xray update response:"
                cat xray-update-response.json

                # ------------------------------------------------
                # j. Check HTTP response
                # ------------------------------------------------

                if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then

                  echo ""
                  echo "ERROR: HTTP failure updating Xray Test Run $TEST_RUN_ID"

                  FAILED_UPDATE_COUNT=$((FAILED_UPDATE_COUNT + 1))

                  continue

                fi

                # ------------------------------------------------
                # k. Check GraphQL errors
                # ------------------------------------------------

                if jq -e '.errors' xray-update-response.json >/dev/null 2>&1; then

                  echo ""
                  echo "ERROR: GraphQL failure updating Xray Test Run $TEST_RUN_ID"

                  jq '.errors' xray-update-response.json

                  FAILED_UPDATE_COUNT=$((FAILED_UPDATE_COUNT + 1))

                else

                  echo ""
                  echo "SUCCESS: Updated Xray Test Run $TEST_RUN_ID"

                  UPDATED_COUNT=$((UPDATED_COUNT + 1))

                fi

                done < <(
                  jq -c '.tests[]' xray-test-results.json
                )

                # --------------------------------------------------
                # l. Final summary
                # --------------------------------------------------

                echo ""
                echo "========================================"
                echo "=== Xray Update Summary ==="
                echo "========================================"
                echo "Successfully updated: $UPDATED_COUNT"
                echo "Failed updates:       $FAILED_UPDATE_COUNT"
                echo "Total Test Runs:      $TEST_RUN_COUNT"
                echo "========================================"

                if [ "$FAILED_UPDATE_COUNT" -gt 0 ]; then

                  echo ""
                  echo "ERROR: One or more Xray Test Run updates failed."

                  exit 1
                fi

                echo ""
                echo "All Xray Test Runs were updated successfully."




      # ----------------------------------------
      # 11. Add actual results / failure details to Xray Test Runs
      # ----------------------------------------

      - name: Update Xray Test Run Results
        id: xray-comments
        if: always()
        shell: bash
        env:
          XRAY_TOKEN: ${{ env.XRAY_TOKEN }}
          JIRA_AUTH: ${{ secrets.JIRA_AUTH }}
        run: |
          set +e

          echo "=== Updating Xray Test Run Results ==="
          echo "Execution ID: $XRAY_EXECUTION_ID"

          if [ -z "$XRAY_TOKEN" ]; then
            echo "ERROR: XRAY_TOKEN is empty"
            exit 1
          fi

          if [ -z "$XRAY_EXECUTION_ID" ]; then
            echo "ERROR: XRAY_EXECUTION_ID is empty"
            exit 1
          fi

          # --------------------------------------------------
          # Get all Test Runs for this execution
          # --------------------------------------------------

          echo ""
          echo "=== Getting Xray Test Runs ==="

          RUN_QUERY='{
            getTestRuns(
              testExecIssueIds: ["'"$XRAY_EXECUTION_ID"'"]
              limit: 100
              start: 0
            ) {
              total
              results {
                id
                status {
                  name
                  description
                }
                test {
                  issueId
                  jira(fields: ["key", "summary"])
                }
                testExecution {
                  issueId
                }
              }
            }
          }'

          echo "=== Test Run GraphQL Query ==="
          echo "$RUN_QUERY"


          curl -s \
            -X POST \
            -H "Authorization: Bearer $XRAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg query "$RUN_QUERY" '{query: $query}')" \
            "https://xray.cloud.getxray.app/api/v2/graphql" \
            > xray-test-runs.json

          echo "=== Xray Test Runs ==="
          jq . xray-test-runs.json

          # --------------------------------------------------
          # Build mapping:
          # Xray Test issue ID -> Test Run ID
          # --------------------------------------------------

          echo ""
          echo "=== Test Run Mapping ==="

          jq -r '
            .data.getTestRuns.results[] |
            "\(.test.issueId)|\(.id)|\(.status.name)"
          ' xray-test-runs.json

          # --------------------------------------------------
          # Parse Postman results
          # --------------------------------------------------

          echo ""
          echo "=== Parsing Postman Results ==="

          if [ ! -f "postman-results.txt" ]; then
            echo "ERROR: postman-results.txt does not exist"
            exit 1
          fi

          grep -E "^Root " postman-results.txt || true

          # --------------------------------------------------
          # Extract Jira test keys from the generated JUnit XML
          # --------------------------------------------------

          if [ ! -f "test-results.xml" ]; then
            echo "ERROR: test-results.xml does not exist"
            exit 1
          fi

          TEST_KEYS=$(grep -oE 'test_key" value="[^"]+' test-results.xml \
            | sed 's/.*value="//' \
            | sort -u)

          echo ""
          echo "=== Jira Test Keys ==="
          echo "$TEST_KEYS"

          # --------------------------------------------------
          # Update each Test Run
          # --------------------------------------------------

          while IFS= read -r TEST_KEY; do

            [ -z "$TEST_KEY" ] && continue

            echo ""
            echo "========================================"
            echo "Processing $TEST_KEY"
            echo "========================================"

          # ----------------------------------------------
          # Get Jira internal issue ID
          # ----------------------------------------------

          JIRA_RESPONSE=$(curl -s \
            -H "Authorization: Basic $JIRA_AUTH" \
            -H "Accept: application/json" \
            "https://ifl-uat.atlassian.net/rest/api/2/issue/$TEST_KEY")

          ISSUE_ID=$(echo "$JIRA_RESPONSE" | jq -r '.id // empty')

          if [ -z "$ISSUE_ID" ]; then
            echo "WARNING: Could not resolve Jira issue ID for $TEST_KEY"
            continue
          fi

          echo "Jira issue ID: $ISSUE_ID"

          # ----------------------------------------------
          # Find corresponding Xray Test Run
          # ----------------------------------------------

          TEST_RUN_ID=$(jq -r \
            --arg issue "$ISSUE_ID" \
            '.data.getTestRuns.results[]
              | select(.test.issueId == $issue)
              | .id' \
            xray-test-runs.json | head -n 1)

          TEST_STATUS=$(jq -r \
            --arg issue "$ISSUE_ID" \
            '.data.getTestRuns.results[]
              | select(.test.issueId == $issue)
              | .status.name' \
            xray-test-runs.json | head -n 1)

          if [ -z "$TEST_RUN_ID" ]; then
            echo "WARNING: No Xray Test Run found for $TEST_KEY"
            continue
          fi

          echo "Test Run ID: $TEST_RUN_ID"
          echo "Status: $TEST_STATUS"

          # ----------------------------------------------
          # Find corresponding testcase in JUnit
          # ----------------------------------------------

          TESTCASE_BLOCK=$(awk \
            -v key="$TEST_KEY" '
            /<testcase/ {
              block=$0 "\n"
              inblock=1
              next
            }

            inblock {
              block=block $0 "\n"

              if ($0 ~ /<\/testcase>/) {
                if (block ~ key) {
                  print block
                }

                block=""
                inblock=0
              }
            }
            ' test-results.xml)

          echo ""
          echo "=== JUnit Test Result ==="
          echo "$TESTCASE_BLOCK"

          # ----------------------------------------------
          # Determine result text
          # ----------------------------------------------

          if echo "$TESTCASE_BLOCK" | grep -q '<failure'; then

            FAILURE_MESSAGE=$(echo "$TESTCASE_BLOCK" \
              | sed -n 's/.*<failure[^>]*>\(.*\)<\/failure>.*/\1/p' \
              | sed 's/&quot;/"/g' \
              | sed 's/&amp;/\&/g')

            COMMENT="FAILED

          Jira Test: $TEST_KEY
          Xray Test Run: $TEST_RUN_ID

          Actual Result:
          The Postman request failed an assertion.

          Failure Details:
          $FAILURE_MESSAGE"

          else

            COMMENT="PASSED

          Jira Test: $TEST_KEY
          Xray Test Run: $TEST_RUN_ID

          Actual Result:
          All assertions for this test case passed successfully in the Postman execution.

          Status:
          $TEST_STATUS"

          fi

          echo ""
          echo "=== Comment to Xray ==="
          echo "$COMMENT"

          # ----------------------------------------------
          # Update Xray Test Run comment
          # ----------------------------------------------

          MUTATION='
          mutation {
            updateTestRunComment(
              id: "'"$TEST_RUN_ID"'"
              comment: "'"$(printf "%s" "$COMMENT" \
                | sed "s/\\\\/\\\\\\\\/g" \
                | sed "s/\"/\\\\\"/g" \
                | tr "\n" " ")"'"
            )
          }'

          echo ""
          echo "=== Updating Test Run Comment ==="

          HTTP_CODE=$(curl -s \
            -o xray-comment-response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $XRAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg query "$MUTATION" '{query: $query}')" \
            "https://xray.cloud.getxray.app/api/v2/graphql")

          echo "HTTP status: $HTTP_CODE"
          cat xray-comment-response.json
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: Failed to update Xray Test Run $TEST_RUN_ID"
            continue
          fi

          if jq -e '.errors' xray-comment-response.json >/dev/null 2>&1; then
            echo "WARNING: Xray returned GraphQL errors"
            jq . xray-comment-response.json
            continue
          fi

          echo "SUCCESS: Xray Test Run comment updated"

          done <<< "$TEST_KEYS"

          echo ""
          echo "=== Xray Test Run Result Update Complete ==="

      
      
      
      # ----------------------------------------
      # 14. Diagnose Xray Test Runs
      # ----------------------------------------
      
      - name: Diagnose Xray Test Runs
        if: always()
        env:
          XRAY_TOKEN: ${{ env.XRAY_TOKEN }}
          XRAY_EXECUTION_KEY: ${{ steps.xray-publish.outputs.XRAY_EXECUTION_KEY }}
        shell: bash
        
        run: |
          set +e

          echo "=== Xray Test Run Diagnostic ==="
          echo "Execution key: $XRAY_EXECUTION_KEY"
          echo "Execution internal ID: $XRAY_EXECUTION_ID"

          if [ -z "$XRAY_TOKEN" ]; then
            echo "ERROR: XRAY_TOKEN is empty"
            exit 1
          fi

          if [ -z "$XRAY_EXECUTION_ID" ]; then
            echo "ERROR: XRAY_EXECUTION_ID is empty"
            exit 1
          fi

          echo "XRAY_TOKEN is present"
          echo ""

          echo "=== Querying Xray Test Runs ==="

          RUN_QUERY='
          {
            getTestRuns(
              testExecIssueIds: ["'"$XRAY_EXECUTION_ID"'"]
              limit: 100
              start: 0
            ) {
              total
              limit
              start

              results {
                id

                status {
                  name
                  description
                }

                test {
                  issueId
                }

                testExecution {
                  issueId
                }

                steps {
                  id
                  action
                  data
                  result
                  actualResult
                  comment

                  status {
                    name
                  }
                 }
                }
               }
              }'

              echo "=== GraphQL Query ==="
              echo "$RUN_QUERY"
              echo ""

              HTTP_CODE=$(curl -s \
                -o xray-test-runs.json \
                -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $XRAY_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$(jq -n --arg query "$RUN_QUERY" '{query: $query}')" \
                "https://xray.cloud.getxray.app/api/v2/graphql")

              echo "HTTP status: $HTTP_CODE"
              echo ""

              echo "=== Raw Xray Response ==="
              cat xray-test-runs.json
              echo ""

              echo "=== Parsed Response ==="
              jq . xray-test-runs.json 2>/dev/null || true
              echo ""

              echo "=== Test Run Summary ==="

              jq -r '
                .data.getTestRuns.results[]? |
                "Test Run ID: \(.id) | Test issue ID: \(.test.issueId) | Status: \(status.name)"
              ' xray-test-runs.json 2>/dev/null || true

              echo ""

              echo "=== Test Run Details ==="

              jq -r '
                .data.getTestRuns.results[]? |

                "========================================",
                "Test Run ID: \(.id)",
                "Test issue ID: \(.test.issueId)",
                "Status: \(status.name)",
                "----------------------------------------",

                (.steps[]? |
                  "Step ID: \(.id)",
                  "Status: \(status.name)",
                  "Action: \(.action // "(none)")",
                  "Data: \(.data // "(none)")",
                  "Result: \(.result // "(none)")",
                  "Actual Result: \(.actualResult // "(none)")",
                  "Comment: \(.comment // "(none)")",
                  ""
                )
              ' xray-test-runs.json 2>/dev/null || true

              echo ""
              echo "=== Diagnostic complete ==="


      # ----------------------------------------
      # Diagnose Xray Test Run update API
      # ----------------------------------------
  
      - name: Diagnose Xray Test Run update API
        if: always()
        env:
          XRAY_TOKEN: ${{ env.XRAY_TOKEN }}
        run: |
          set +e

          echo "=== Xray GraphQL Mutation Diagnostic ==="

          if [ -z "$XRAY_TOKEN" ]; then
            echo "ERROR: XRAY_TOKEN is empty"
            exit 1
          fi

          INTROSPECTION='
          {
           __schema {
            mutationType {
             fields {
              name
              description
              args {
                name
                type {
                  kind
                  name
                  ofType {
                    kind
                    name
                   }
                  }
                 }
                }
               }
              }
             }'

            HTTP_CODE=$(curl -s \
              -o xray-mutations.json \
              -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $XRAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg query "$INTROSPECTION" '{query: $query}')" \
              "https://xray.cloud.getxray.app/api/v2/graphql")

            echo "HTTP status: $HTTP_CODE"
            echo ""

            echo "=== Raw response ==="
            cat xray-mutations.json
            echo ""

            echo "=== Mutations containing test/run/result/comment ==="

            jq -r '
              .data.__schema.mutationType.fields[]
              | select(
                (.name | ascii_downcase | contains("test"))
                or
                (.name | ascii_downcase | contains("run"))
                or
                (.name | ascii_downcase | contains("result"))
                or
                (.name | ascii_downcase | contains("comment"))
               )
              | .name
            ' xray-mutations.json 2>/dev/null || true

            echo ""
            echo "=== Full mutation schema ==="

            jq '
              .data.__schema.mutationType.fields[]
              | {
                 name,
                 description,
                 args
                }
            ' xray-mutations.json 2>/dev/null || true

      

      
      # ----------------------------------------
      # 14. Generate Postman Test Summary
      # ----------------------------------------
          
      - name: Generate Postman Test Summary
        if: always()
        shell: bash
        run: |

          echo "## 🧪 AEP API Test Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------:|" >> "$GITHUB_STEP_SUMMARY"

          # Extract the Postman summary rows.
          REQUEST_LINE=$(grep -E '^\|[[:space:]]+requests[[:space:]]+\|' postman-results.txt || true)
          ASSERTION_LINE=$(grep -E '^\|[[:space:]]+assertions[[:space:]]+\|' postman-results.txt || true)

          # Extract executed and failed values.
          REQUESTS=$(echo "$REQUEST_LINE" |
            sed -E 's/.*\|[[:space:]]*([0-9]+)[[:space:]]*\|[[:space:]]*([0-9]+)[[:space:]]*\|.*/\1/' || true)

          FAILED_REQUESTS=$(echo "$REQUEST_LINE" |
            sed -E 's/.*\|[[:space:]]*([0-9]+)[[:space:]]*\|[[:space:]]*([0-9]+)[[:space:]]*\|.*/\2/' || true)

          ASSERTIONS=$(echo "$ASSERTION_LINE" |
            sed -E 's/.*\|[[:space:]]*([0-9]+)[[:space:]]*\|[[:space:]]*([0-9]+)[[:space:]]*\|.*/\1/' || true)

          FAILED_ASSERTIONS=$(echo "$ASSERTION_LINE" |
            sed -E 's/.*\|[[:space:]]*([0-9]+)[[:space:]]*\|[[:space:]]*([0-9]+)[[:space:]]*\|.*/\2/' || true)

          # Fallback values.
          [ -z "$REQUESTS" ] && REQUESTS="N/A"
          [ -z "$FAILED_REQUESTS" ] && FAILED_REQUESTS="N/A"
          [ -z "$ASSERTIONS" ] && ASSERTIONS="N/A"
          [ -z "$FAILED_ASSERTIONS" ] && FAILED_ASSERTIONS="N/A"

          echo "| 📋 Requests | $REQUESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ❌ Failed Requests | $FAILED_REQUESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔎 Assertions | $ASSERTIONS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ❌ Failed Assertions | $FAILED_ASSERTIONS |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 🌐 Execution Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ github.event.inputs.environment || 'dev' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Collection | aep-regression |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Framework | Postman CLI |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | GitHub-hosted Ubuntu |" >> "$GITHUB_STEP_SUMMARY"


      
      # ----------------------------------------
      # 15. Upload Postman results
      # ----------------------------------------

      - name: Upload Postman Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: postman-results
         path: postman-results.txt
         retention-days: 10

    


      # ----------------------------------------
      # 16. Check test result
      # ----------------------------------------

      - name: Check Test Result
        if: always()
        shell: bash
        run: |
          POSTMAN_EXIT_CODE="${{ steps.postman.outputs.POSTMAN_EXIT_CODE }}"

          echo "Postman exit code: $POSTMAN_EXIT_CODE"

          if [ "$POSTMAN_EXIT_CODE" != "0" ]; then
            echo "AEP API Regression failed"
            exit 1
          fi

          echo "AEP API Regression passed"


