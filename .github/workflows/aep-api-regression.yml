name: AEP API Tests

on:

  workflow_dispatch:

    inputs:
      environment:
        description: Test Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat
          - prod

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    name: Run AEP API Tests

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Setup Node
      # ----------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ----------------------------------------
      # 3. Install Postman CLI
      # ----------------------------------------

      - name: Install Postman CLI
        run: |
          npm install -g postman


      # ----------------------------------------
      # 4. Verify Postman CLI
      # ----------------------------------------

      - name: Verify Postman CLI
        run: |
          postman --version


      # ----------------------------------------
      # 5. Select environment
      # ----------------------------------------

      - name: Select Postman Environment
        id: environment
        shell: bash
        run: |

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"

          echo "Running AEP API tests against: $ENVIRONMENT"

          echo "ENV_FILE=postman/environments/${ENVIRONMENT}.json" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 6. Run Postman collection
      # ----------------------------------------

      - name: Run AEP API Tests
        id: postman
        continue-on-error: true
        shell: bash
        run: |

          postman collection run \
            "postman/collections/aep-regression.json" \
            --environment "${{ steps.environment.outputs.ENV_FILE }}"


      # ----------------------------------------
      # 7. Check test result
      # ----------------------------------------

      - name: Check Test Result
        if: always()
        shell: bash
        run: |

          if [ "${{ steps.postman.outcome }}" != "success" ]; then

            echo "AEP API tests failed"

            exit 1

          fi