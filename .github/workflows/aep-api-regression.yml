name: AEP API Regression

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Test Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat
          - prod

  push:
    branches:
      - main
      - Updates

  pull_request:
    branches:
      - main
      - Updates


jobs:
  api-tests:
    name: Run AEP API Regression
    runs-on: ubuntu-latest

    # This selects the GitHub Environment and therefore
    # exposes the correct environment secrets.
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Install Postman CLI
      # ----------------------------------------

      - name: Install Postman CLI
        run: |
          npm install -g postman-cli
          postman --version


      # ----------------------------------------
      # 3. Verify collection exists
      # ----------------------------------------

      - name: Verify Postman collection
        run: |
          test -f postman/collections/aep-regression.json
          echo "Collection found:"
          ls -lh postman/collections/aep-regression.json


      # ----------------------------------------
      # 4. Run Postman collection
      # ----------------------------------------

      - name: Run AEP regression collection
        id: postman
        continue-on-error: true
        env:
          AEP_CLIENT_ID: ${{ secrets.AEP_CLIENT_ID }}
          AEP_CLIENT_SECRET: ${{ secrets.AEP_CLIENT_SECRET }}
          AEP_SCOPE: ${{ secrets.AEP_SCOPE }}
        run: |
          mkdir -p test-results

          postman collection run \
            postman/collections/aep-regression.json \
            --env-var "AEP_CLIENT_ID=$AEP_CLIENT_ID" \
            --env-var "AEP_CLIENT_SECRET=$AEP_CLIENT_SECRET" \
            --env-var "AEP_SCOPE=$AEP_SCOPE" \
            --reporters cli,junit \
            --reporter-junit-export test-results/postman-results.xml


      # ----------------------------------------
      # 5. Upload Postman results
      # ----------------------------------------

      - name: Upload Postman test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-results
          path: test-results/
          retention-days: 7


      # ----------------------------------------
      # 6. Fail workflow if Postman tests failed
      # ----------------------------------------

      - name: Check Postman test result
        if: always()
        run: |
          if [ "${{ steps.postman.outcome }}" != "success" ]; then
            echo "Postman API tests failed"
            exit 1
          fi

          echo "Postman API tests passed"
