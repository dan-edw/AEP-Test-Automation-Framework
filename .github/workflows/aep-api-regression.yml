name: AEP API Regression

on:

  workflow_dispatch:
    inputs:
      environment:
        description: Test Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat
          - prod

  push:
    branches:
      - main
      - Updates

  pull_request:
    branches:
      - main
      - Updates


jobs:

  test:

    name: Run AEP API Regression

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Install Postman CLI
      # ----------------------------------------

      - name: Install Postman CLI
        shell: bash
        run: |
          curl -o- https://dl-cli.pstmn.io/install/linux64.sh | sh
          echo "$HOME/.postman/bin" >> "$GITHUB_PATH"


      # ----------------------------------------
      # 3. Verify Postman CLI
      # ----------------------------------------

      - name: Verify Postman CLI
        run: |
          postman --version


      # ----------------------------------------
      # 4. Inspect Postman files
      # ----------------------------------------

      - name: Inspect Postman files
        run: |
          echo "=== Postman files ==="
          find postman -maxdepth 6 -type f | sort

          echo ""
          echo "=== Collection directory ==="
          ls -la postman/collections/aep-regression


      # ----------------------------------------
      # 5. Select environment
      # ----------------------------------------

      - name: Select Postman Environment
        id: environment
        shell: bash
        run: |

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"

          echo "Running AEP API Regression against: $ENVIRONMENT"

          ENV_FILE="postman/environments/${ENVIRONMENT}.json"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Environment file not found:"
            echo "$ENV_FILE"
            exit 1
          fi

          echo "Using environment file:"
          echo "$ENV_FILE"

          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 6. Validate Postman collection
      # ----------------------------------------

      - name: Validate Postman Collection
        run: |
          postman collection lint \
            "postman/collections/aep-regression"


      # ----------------------------------------
      # 7. Run Postman collection
      # ----------------------------------------

      - name: Run AEP API Tests
        id: postman
        continue-on-error: true
        shell: bash
        run: |

          postman collection run \
            "postman/collections/aep-regression" \
            --environment "${{ steps.environment.outputs.ENV_FILE }}" \
            --reporters cli,junit \
            --reporter-junit-export "postman-results.xml"


      # ----------------------------------------
      # 8. Upload Postman results
      # ----------------------------------------

      - name: Upload Postman Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-results
          path: postman-results.xml
          retention-days: 7


      # ----------------------------------------
      # 9. Check test result
      # ----------------------------------------

      - name: Check Test Result
        if: always()
        shell: bash
        run: |

          if [ "${{ steps.postman.outcome }}" != "success" ]; then
            echo "AEP API tests failed"
            exit 1
          fi
