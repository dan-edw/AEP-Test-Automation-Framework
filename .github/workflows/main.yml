name: AEP Tests
on:
  push:
    branches: [ main, master ]
    
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ENVIRONMENT: prod
    
    steps:
    - uses: actions/checkout@v6
    
    - uses: actions/setup-node@v6
      with: 
       node-version: 24
       
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npx playwright test

    # ----------------------------------------
    # Generate Playwright Test Summary
    # ----------------------------------------

    - name: Generate Playwright Test Summary
      if: always()
      shell: bash
      run: |

        TOTAL=$(grep -o 'tests="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')
        FAILED=$(grep -o 'failures="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')
        SKIPPED=$(grep -o 'skipped="[0-9]*"' test-results.xml | head -1 | grep -o '[0-9]*')

        PASSED=$((TOTAL - FAILED - SKIPPED))

        TEST_CASES=$(grep -c "<testcase" test-results.xml)

        BROWSERS=$(grep 'hostname=' test-results.xml \
         | sed -E 's/.*hostname="([^"]+)".*/\1/' \
         | sort -u \
         | wc -l)

        {
         echo "## 🧪 Playwright Test Execution Summary"
         echo ""
         echo "| Metric | Count |"
         echo "|--------|------:|"
         echo "| 📋 Test Cases | $((TEST_CASES / BROWSERS)) |"
         echo "| 🌐 Browsers | $BROWSERS |"
         echo "| ▶️ Test Executions | $TOTAL |"
         echo "| ✅ Passed | $PASSED |"
         echo "| ⚠️ Skipped | $SKIPPED |"
         echo "| ❌ Failed | $FAILED |"
        } >> "$GITHUB_STEP_SUMMARY"


    - name: Publish Environment Summary
      if: always()
      shell: bash
      run: |
       {
        echo ""
        echo "## 🌐 Execution Configuration"
        echo ""
        echo "| Setting | Value |"
        echo "|---------|-------|"
        echo "| Environment | ${ENVIRONMENT} |"
        echo "| Browser Coverage | Chromium, Firefox, WebKit, Microsoft Edge |"
        echo "| Framework | Playwright |"
        echo "| Report Format | JUnit XML, Playwright HTML |"
        echo "| Operating System | Ubuntu Latest |"
        echo "| Node Version | 24 |"
       } >> "$GITHUB_STEP_SUMMARY"

    - name: Publish Reports Available
      if: always()
      run: |
        {
          echo ""
          echo "## 📄 Reports"
          echo ""
          echo "- 📊 HTML Report available in workflow artifacts"
          echo "- 📄 JUnit XML available in workflow artifacts"
        } >> $GITHUB_STEP_SUMMARY

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 10
      
    - name: Upload JUnit Results 
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: junit-results
        path: test-results.xml
        retention-days: 10
